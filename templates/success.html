<!DOCTYPE html>
<html>
<head> 
    <title>Success</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Sliding Diagonal Background -->
    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>

    <!-- Card -->
    <div class="card">
        <h1>Welcome {{name}}</h1>
        <h2 id="message-box"></h2>
        <p>You are marked present</p>
        <p>{{time}}</p>
    </div>

    <script>
        function fetchMessage() {
            fetch("/student-data")
            .then(response => response.json())
            .then(data => {
                document.getElementById("message-box").innerText = data.message;
            });
        }
        setInterval(fetchMessage, 2000);
        fetchMessage();
    </script>

</body>
</html>
